{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymorphic Solitaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .landing-container {
            text-align: center;
            color: white;
            max-width: 600px;
        }
        .btn-landing {
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: all 0.3s;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .btn-play { background: #28a745; color: white; }
        .btn-login { background: rgba(255,255,255,0.2); color: white; border: 2px solid white; }
        .btn-group-landing { display: flex; gap: 15px; justify-content: center; }
    </style>
</head>
<body>
    <div class="landing-container">
        <h1>🎴 Polymorphic Solitaire</h1>
        <p>Play multiple solitaire variants and track your progress.</p>
        
        <div class="btn-group-landing">
            {% if user.is_authenticated %}
                <a href="{% url 'game_directory' %}" class="btn btn-landing btn-play">🎮 Start Playing</a>
                <a href="{% url 'statistics' %}" class="btn btn-landing btn-login">📊 View Stats</a>
            {% else %}
                <a href="{% url 'register' %}" class="btn btn-landing btn-play">Create Account</a>
                <a href="{% url 'login' %}" class="btn btn-landing btn-login">Login</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
